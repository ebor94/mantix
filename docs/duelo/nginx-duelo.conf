# ===== DUELO ANIMAL — fragmento para el server de mantix-api (:8444) =====
# La inscripción puede traer hasta 3 fotos de 10 MB cuando el navegador no logra redimensionarlas.
#
# Recomendado antes de la pauta (opcional, pero protege a Mantix): limitar conexiones y ritmo por IP en
# la inscripción. Las zonas NO se pueden declarar aquí: van en el bloque `http { ... }` de nginx.conf
# (por ejemplo en /etc/nginx/conf.d/duelo-zonas.conf, que se incluye dentro de `http`):
#
#     limit_conn_zone $binary_remote_addr zone=duelo_conn:10m;
#     limit_req_zone  $binary_remote_addr zone=duelo_req:10m rate=10r/m;
#
# y luego se descomentan las tres líneas `limit_*` de este location. Los operadores móviles comparten IP
# entre muchas personas: no bajar de estos valores sin mirar los registros. El backend ya limita a 2
# inscripciones con fotos procesándose a la vez (20 en espera; el resto recibe 503 OCUPADO).
location = /api/duelo/v1/inscripciones {
    # limit_conn duelo_conn 4;
    # limit_req  zone=duelo_req burst=20 nodelay;
    # limit_req_status 429;
    client_max_body_size 35m;
    proxy_request_buffering on;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:3020;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
